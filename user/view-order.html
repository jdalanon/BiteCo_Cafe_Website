    <!-- Logo icon -->
    <link
      rel="icon"
      href="https://ykldzfsbmlcjftfartax.supabase.co/storage/v1/object/sign/images/logo.jpg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV9hMGZmNjhjOC02MjNmLTQwZmYtYWEzMy0zZGM5YTRjYjc4YWUiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJpbWFnZXMvbG9nby5qcGciLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg1ODk4ODM5LCJleHAiOjI3MzE5Nzg4Mzl9.EroJmvTjl6xkJvqkNl07TyhCjLwDUK42QPUPvLGiSMc"
    />

    <!-- CSS file -->
    <link rel="stylesheet" href="../css/style.css" />

  <body>
    <header>
      <nav class="navbar">
        <div class="logo">
          <img
            src="https://ykldzfsbmlcjftfartax.supabase.co/storage/v1/object/sign/images/logo.jpg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV9hMGZmNjhjOC02MjNmLTQwZmYtYWEzMy0zZGM5YTRjYjc4YWUiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJpbWFnZXMvbG9nby5qcGciLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg1ODk4ODM5LCJleHAiOjI3MzE5Nzg4Mzl9.EroJmvTjl6xkJvqkNl07TyhCjLwDUK42QPUPvLGiSMc"
            alt="Bite Co. Logo"
          />
          <h2>Bite Co.</h2>
        </div>

        <ul class="nav-links">
          <li><a href="home.html">Home</a></li>

          <li class="dropdown">
            <span class="dropdown-btn"> Menu ▾ </span>

            <ul class="dropdown-menu">
              <li><a href="menu.html?category=Drinks">Drinks</a></li>
              <li><a href="menu.html?category=Snacks">Snacks</a></li>
            </ul>
          </li>

          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>

        <div class="menu-btn">&#9776;</div>
        <!-- <div class="cart-icon"> <a href=cart.html> 🛒 </a> <span id="cart-count">0</span> -->

        <!-- Profile & Cart -->
        <div class="nav-actions">
          <div class="profile-dropdown">
            <button class="profile-btn" id="profileBtn">👤</button>
            <div class="profile-menu" id="profileMenu">
              <!-- Profile Header -->
              <div class="profile-header">
                <h4 id="profile-name">Guest</h4>
                <p id="profile-email"></p>
              </div>

              <hr />

              <!-- My Profile -->
              <a href="profile.html" class="profile-menu-item">
                👤 My Profile
              </a>

              <!-- Orders -->
              <div class="order-dropdown">
                <button class="order-menu-btn" id="orderMenuBtn">
                  🛍️ Order
                  <span>▾</span>
                </button>

                <div class="order-submenu" id="orderSubmenu">
                  <a href="view-order.html"> 📦 View Order </a>

                  <a href="order-history.html"> 🕘 Order History </a>
                </div>
              </div>

              <hr />

              <!-- Logout -->
              <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
            </div>
          </div>

          <div class="cart-icon">
            <a href="cart.html">🛒</a>
            <span id="cart-count">0</span>
          </div>
        </div>
      </nav>
    </header>

    <!-- Profile Dashboard -->
    <section class="profile-dashboard">
      <!-- LEFT PROFILE CARD -->
      <div class="profile-card">
        <div class="profile-cover"></div>

        <div class="profile-avatar">👤</div>

        <h2 id="profileFullName"></h2>

        <p id="profileRole"></p>
      </div>

      <!-- RIGHT ORDER DETAILS -->
      <div class="profile-info order-info">
        <h2>Order Details</h2>

        <!-- Order Header -->
        <div class="order-header">
          <div>
            <label> Order ID </label>

            <strong id="orderId"> - </strong>
          </div>

          <div>
            <label> Order Date </label>

            <strong id="orderDate"> - </strong>
          </div>
        </div>

        <!-- Order Items -->
        <div class="order-items">
          <h3>Items</h3>

          <div id="orderItems">
            <!-- Order items will be loaded here -->
          </div>
        </div>

        <!-- Order Summary -->
        <div class="order-summary">
          <div class="order-row">
            <span> Payment Method </span>

            <strong id="paymentMethod"> - </strong>
          </div>

          <div class="order-row">
            <span> Payment Status </span>

            <strong id="paymentStatus" class="status"> - </strong>
          </div>

          <div class="order-row">
            <span> Order Status </span>

            <strong id="orderStatus" class="status"> - </strong>
          </div>

          <div class="order-total">
            <span> Total </span>

            <strong> ₱<span id="orderTotal"> 0.00 </span> </strong>
          </div>
        </div>

        <!-- Back Button -->
        <div class="profile-actions">
          <button
            class="edit-btn"
            onclick="window.location.href = 'profile.html'"
          >
            Back to Profile
          </button>
        </div>
      </div>
    </section>

    <footer>
      <p>© 2025 Bite Co. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/shared/supabase.js"></script>
    <script src="../js/user/navbar.js"></script>
    <script src="../js/user/cart.js"></script>
    <script src="../js/user/view-order.js"></script>
  </body>
</html>
