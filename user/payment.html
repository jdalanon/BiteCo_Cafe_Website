    <!-- Payment Section -->
    <section class="payment-page">
      <div class="payment-card">
        <h2>Fund Transfer</h2>

        <p class="subtitle">Select your preferred payment provider.</p>

        <!-- Payment Selection -->
        <div class="payment-selection">
          <label>
            <input type="radio" name="payment" value="GCash" />

            GCash
          </label>

          <label>
            <input type="radio" name="payment" value="Maya" />

            Maya
          </label>

          <label>
            <input type="radio" name="payment" value="CIMB" />

            CIMB
          </label>
        </div>

        <hr />

        <!-- Payment Details -->

        <div id="paymentDetails" class="payment-details hidden">
          <img id="qrImage" class="qr-image" />

          <div class="detail">
            <label>Account Name</label>

            <input id="accountName" readonly />
          </div>

          <div class="detail">
            <label>Account Number</label>

            <input id="accountNumber" readonly />
          </div>

          <div class="detail">
            <label>Total Amount</label>

            <input id="paymentAmount" readonly />
          </div>

          <div class="detail">
            <label> Reference Number </label>

            <input id="referenceNumber" placeholder="Enter reference number" />
          </div>

          <div class="detail">
            <label> Upload Receipt </label>

            <input type="file" id="proofImage" accept="image/*" />
          </div>

          <button id="submitPayment" class="submit-btn">Submit Payment</button>
        </div>
      </div>
    </section>
